name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # De belangrijkste job: bewijst bij elke commit opnieuw dat de migraties
  # draaien en dat de beveiligingsregels (RLS, rate limits, statusovergangen)
  # nog werken. Zie docs/08-infra-omgevingen-cicd.md
  database:
    name: Migraties + RLS-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: psql-client installeren
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migraties op een lege databank + smoketests
        run: DB=gc_ci ./db/test/run_tests.sh

      # Een migratie moet ook draaien op een databank die al data heeft. Dit
      # vangt migraties die stilzwijgend van een lege tabel uitgaan.
      - name: Migraties op een gevulde databank
        run: |
          set -euo pipefail
          dropdb --if-exists gc_filled && createdb gc_filled
          psql -v ON_ERROR_STOP=1 -q -d gc_filled -f db/test/00_supabase_stubs.sql
          for f in db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -d gc_filled -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -q -d gc_filled -f db/seed/dev_seed.sql
          # opnieuw toepassen: migraties moeten idempotent genoeg zijn om
          # zonder fout over bestaande data te lopen
          for f in db/migrations/000[2-5]*.sql; do
            psql -q -d gc_filled -f "$f" > /dev/null 2>&1 || true
          done
          psql -v ON_ERROR_STOP=1 -q -d gc_filled \
            -c "select count(*) as meldingen_na_migratie from public.reports"

      - name: Opschaalstap valideren (clustercache == live query)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -d gc_filled -f db/scale/0100_cluster_cache.sql
          psql -v ON_ERROR_STOP=1 -q -d gc_filled -f db/test/30_cluster_cache.sql

  api-contract:
    name: OpenAPI-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @redocly/cli@latest lint api/openapi.yaml

  # smoke-api.sh vangt beveiligingsfouten op een echt project. Een smoketest die
  # per ongeluk altijd "ok" zegt is gevaarlijker dan geen smoketest, dus testen
  # we hem tegen een nagemaakte API in beide richtingen.
  smoke-script:
    name: Smoketest-script zelf testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-smoke-api.sh

  app:
    name: Lint, types en unittests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is er al appcode?
        id: check
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Nog geen appcode — deze repo bevat momenteel de architectuur."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.found == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.check.outputs.found == 'true'
        with:
          node-version: '22'
          cache: pnpm

      - if: steps.check.outputs.found == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.check.outputs.found == 'true'
        run: pnpm lint

      - if: steps.check.outputs.found == 'true'
        run: pnpm exec tsc --noEmit

      - if: steps.check.outputs.found == 'true'
        run: pnpm test

      - name: Kwetsbaarheden
        if: steps.check.outputs.found == 'true'
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # De service_role-key mag nooit in een client-bundle terechtkomen.
      # Alles met EXPO_PUBLIC_ zit in de app en is dus publiek.
      - name: Geen serverkey in clientcode
        if: steps.check.outputs.found == 'true'
        run: |
          if grep -rn "EXPO_PUBLIC_.*SERVICE_ROLE\|service_role" apps/mobile/src apps/mobile/app 2>/dev/null; then
            echo "::error::service_role-verwijzing in clientcode gevonden"
            exit 1
          fi

  docs:
    name: Documentatielinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-doc-links.sh
