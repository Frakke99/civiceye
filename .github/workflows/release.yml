name: Release

# Draait op een versietag. De volgorde is opzettelijk: migraties naar staging
# gaan vóór de builds, zodat een migratieprobleem opvalt vóórdat er een build
# in TestFlight staat. Productie volgt pas na een handmatige go/no-go.
# Zie docs/08-infra-omgevingen-cicd.md en docs/10-rollout-en-testplan.md

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Doelomgeving
        type: choice
        options: [staging, production]
        default: staging

jobs:
  staging:
    name: Migraties + builds naar staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Migraties in CLI-formaat klaarzetten
        # De Supabase CLI verwacht supabase/migrations/<tijdstempel>_naam.sql.
        # Wij nummeren 0001..000n; de afgeleide tijdstempel is deterministisch,
        # zodat db push over releases heen bijhoudt wat al toegepast is.
        run: |
          mkdir -p supabase/migrations
          i=0
          for f in db/migrations/*.sql; do
            i=$((i+1))
            cp "$f" "supabase/migrations/$(printf '20260101%06d' "$i")_$(basename "$f")"
          done
          ls supabase/migrations

      - name: Migraties naar staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.STAGING_PROJECT_REF }}"
          supabase db push

      - name: Edge Functions naar staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -d supabase/functions ]; then
            supabase functions deploy --project-ref "${{ vars.STAGING_PROJECT_REF }}"
          else
            echo "nog geen edge functions (sprint 3) — stap overgeslagen"
          fi

      - uses: pnpm/action-setup@v4 # pnpm-versie komt uit packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: iOS + Android bouwen en naar de testkanalen sturen
        run: eas build --profile staging --platform all --non-interactive --auto-submit

      # web:build draait ook prepare:web (de maplibre-worker, zie
      # scripts/prepare-web-assets.mjs); zonder die stap is de kaart leeg.
      - name: Web-build
        run: pnpm web:build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/mobile/dist
          retention-days: 14

  production:
    name: Naar productie (na go/no-go)
    needs: staging
    # Op een versietag, of via een handmatige dispatch met target=production —
    # zonder deze tweede voorwaarde deed de dispatch-input niets.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    # De environment 'production' heeft een verplichte reviewer in GitHub:
    # dat ís de go/no-go-poort uit docs/10-rollout-en-testplan.md
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Databankdump als extra vangnet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.PROD_PROJECT_REF }}"
          supabase db dump -f pre-release-dump.sql

      - uses: actions/upload-artifact@v4
        with:
          name: pre-release-dump
          path: pre-release-dump.sql
          retention-days: 30

      - name: Migraties in CLI-formaat klaarzetten
        # De Supabase CLI verwacht supabase/migrations/<tijdstempel>_naam.sql.
        # Wij nummeren 0001..000n; de afgeleide tijdstempel is deterministisch,
        # zodat db push over releases heen bijhoudt wat al toegepast is.
        run: |
          mkdir -p supabase/migrations
          i=0
          for f in db/migrations/*.sql; do
            i=$((i+1))
            cp "$f" "supabase/migrations/$(printf '20260101%06d' "$i")_$(basename "$f")"
          done
          ls supabase/migrations

      - name: Migraties naar productie
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: supabase db push

      - name: Edge Functions naar productie
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -d supabase/functions ]; then
            supabase functions deploy --project-ref "${{ vars.PROD_PROJECT_REF }}"
          else
            echo "nog geen edge functions (sprint 3) — stap overgeslagen"
          fi

      - uses: pnpm/action-setup@v4 # pnpm-versie komt uit packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Gefaseerde uitrol: Android start op 5 %, iOS met een phased release.
      - name: Store-builds inzenden
        run: eas build --profile production --platform all --non-interactive --auto-submit
